{% extends "base.html" %}

{% block content %}

<div class="upload-box">

<h2>Upload Medical Scan</h2>
<p>Select disease category and upload the medical image</p>

<form action="/predict" method="POST" enctype="multipart/form-data">

<label>Select Disease Type</label>

<br><br>

<select name="disease" required>

<option value="brain">Brain Tumor (MRI)</option>
<option value="pneumonia">Pneumonia (Chest X-ray)</option>
<option value="eye">Eye Disease (Fundus Image)</option>

</select>

<br><br>

<input type="file" name="image" accept="image/*" required>

<br><br>

<button type="submit">Analyze Image</button>

</form>

</div>

{% endblock %}
